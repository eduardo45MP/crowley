[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowley-crawler"
version = "0.1.0"
description = "Local marketplace research crawler"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["SQLAlchemy>=2.0,<3"]

[project.scripts]
crawler = "crawler.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
